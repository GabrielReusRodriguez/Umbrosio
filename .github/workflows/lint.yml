name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Instalar ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Comprobar que umbrosio es ejecutable
        run: test -x src/umbrosio

      - name: Validar sintaxis de Bash
        run: bash -n src/umbrosio

      - name: Analizar scripts con ShellCheck
        run: shellcheck --severity=style src/umbrosio tests/helpers/mock_curl
